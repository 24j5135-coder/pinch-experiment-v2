<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ピンチ操作の実験</title>
  <style>
    body { font-family: sans-serif; color: #333; margin: 0; padding: 24px 20px; max-width: 480px; margin-inline: auto; line-height: 1.7; }
    h1 { font-size: 20px; }
    h2 { font-size: 17px; margin: 28px 0 4px; border-bottom: 1px solid #ccc; }
    input { font-size: 20px; padding: 10px; width: 100%; box-sizing: border-box; text-align: center; }
    button { font-size: 20px; padding: 14px 20px; width: 100%; margin-top: 12px; border: 0; border-radius: 10px; background: #2878c8; color: #fff; }
    .sub { background: none; color: #666; font-size: 14px; text-decoration: underline; margin-top: 32px; }
    ol { padding-left: 1.4em; margin: 6px 0; }
    ul { list-style: none; padding-left: 0.4em; margin: 6px 0; }
    .done { color: #2a8a3a; }
    .next { font-weight: bold; }
    .err { color: #c00; min-height: 1.5em; }
    .memo { color: #999; font-size: 12px; margin: 2px 0 0; }
  </style>
</head>
<body>
  <h1>ピンチ操作の実験</h1>
  <p>タッチスクリーンでの2本指のピンチ操作(広げる・近づける動き)を体験し、そのあとにアンケートに回答していただきます。実験者の指示に従って、進めてください。</p>

  <div id="start">
    <p>実験者から伝えられた被験者IDを入力してください。</p>
    <input id="idInput" placeholder="被験者ID(例:P01)" autocomplete="off" autocapitalize="off">
    <div class="err" id="err"></div>
    <button id="startBtn">はじめる</button>
  </div>

  <div id="progress" style="display:none">
    <p>被験者ID:<b id="idLabel"></b></p>
    <div id="exps"></div>
    <button class="sub" id="resetBtn">別の被験者として始める(記録を消す)</button>
  </div>

  <script>
    // 実験の一覧(名前、見出し、条件の数)
    var EXPS = [
      { name: 'practice', title: '練習(音なし・記録なし)', n: 1, label: '練習', start: '練習を始める' },
      { name: 'exp1', title: '実験1', n: 4 },
      { name: 'exp2', title: '実験2', n: 4 }
    ];
    function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
    function clearAll() {
      del('pinch_id');
      EXPS.forEach(function (e) {
        del('pinch_order_' + e.name);
        for (var i = 1; i <= e.n; i++) del('pinch_done_' + e.name + '_' + i);
      });
    }

    // 条件の提示順序:参加者ごとにランダムに決めて保存する(練習は順番なし)
    function shuffled(n) {
      var a = [];
      for (var i = 1; i <= n; i++) a.push(i);
      for (var j = a.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var t = a[j]; a[j] = a[k]; a[k] = t;
      }
      return a;
    }
    function getOrder(e) {
      if (e.name === 'practice') return [1];
      var saved = (get('pinch_order_' + e.name) || '').split(',').map(Number);
      var ok = saved.length === e.n && saved.slice().sort().join(',') === shuffled(e.n).sort().join(',');
      if (ok) return saved;
      var order = shuffled(e.n);
      set('pinch_order_' + e.name, order.join(','));
      return order;
    }

    function render() {
      var id = get('pinch_id');
      document.getElementById('start').style.display = id ? 'none' : '';
      document.getElementById('progress').style.display = id ? '' : 'none';
      if (!id) return;
      document.getElementById('idLabel').textContent = id;

      var box = document.getElementById('exps');
      box.innerHTML = '';
      EXPS.forEach(function (e) {
        var order = getOrder(e);
        var next = 0, nextPos = 0, items = '';
        for (var pos = 1; pos <= e.n; pos++) {
          var i = order[pos - 1];                       // pos番目に行う条件の番号
          var done = get('pinch_done_' + e.name + '_' + i) === '1';
          if (!done && next === 0) { next = i; nextPos = pos; }
          var cls = done ? 'done' : (next === i ? 'next' : '');
          var mark = done ? '(完了)' : (next === i ? '(次はこちら)' : '');
          items += '<li class="' + cls + '">' + (e.label || pos + 'つ目') + ' ' + mark + '</li>';
        }
        var sec = document.createElement('div');
        sec.innerHTML = '<h2>' + e.title + '</h2><ul>' + items + '</ul>' +
          (e.name === 'practice' ? '' : '<p class="memo">記録用:条件の順番 ' + order.join(' → ') + '</p>');
        if (next === 0) {
          sec.insertAdjacentHTML('beforeend', '<p><b>' + (e.name === 'practice' ? '練習は終了しました。' : e.title + 'はすべて終了しました。') + '</b></p>');
        } else {
          var b = document.createElement('button');
          b.textContent = e.start || (e.title + ':' + (nextPos === 1 ? '1つ目を始める' : nextPos + 'つ目へ進む'));
          b.onclick = function () { window.location.href = e.name + '_cond' + next + '/'; };
          sec.appendChild(b);
        }
        box.appendChild(sec);
      });
    }

    document.getElementById('startBtn').onclick = function () {
      var id = document.getElementById('idInput').value.trim().replace(/[^A-Za-z0-9_\-]/g, '');
      if (id === '') { document.getElementById('err').textContent = '被験者IDを入力してください。'; return; }
      clearAll();
      set('pinch_id', id);
      render();
    };
    document.getElementById('resetBtn').onclick = function () {
      if (!confirm('記録を消して、別の被験者として始めます。よろしいですか?')) return;
      clearAll();
      location.reload();
    };
    render();
  </script>
</body>
</html>
